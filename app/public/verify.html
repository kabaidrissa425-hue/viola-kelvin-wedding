<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket Verify — Viola &amp; Kelvin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #FBF8F4;
    --ink: #17181D;
    --slate: #5B6472;
    --blush: #BE9483;
    --green: #2D6A4F;
    --green-bg: #D8F3DC;
    --red: #9B2226;
    --red-bg: #FFE0E0;
    --amber: #7B4F2E;
    --amber-bg: #FFF3CD;
  }
  html, body {
    min-height: 100%;
    background: var(--ink);
    font-family: 'Jost', sans-serif;
    color: var(--ink);
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100dvh;
    padding: 28px 20px 40px;
    gap: 16px;
  }

  /* Venue selector bar */
  .venue-bar {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: 420px;
  }
  .venue-bar-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: rgba(255,255,255,.4);
  }
  .venue-toggle {
    display: flex;
    background: rgba(255,255,255,.1);
    border-radius: 100px;
    padding: 3px;
    gap: 2px;
    width: 100%;
    max-width: 300px;
  }
  .vtoggle {
    flex: 1;
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    border: none;
    border-radius: 100px;
    padding: 10px 16px;
    cursor: pointer;
    color: rgba(255,255,255,.55);
    background: transparent;
    transition: background .2s, color .2s;
  }
  .vtoggle.is-active {
    background: var(--cream);
    color: var(--ink);
  }

  /* Card */
  .card {
    background: var(--cream);
    border-radius: 20px;
    width: 100%;
    max-width: 420px;
    padding: 40px 32px 36px;
    text-align: center;
  }
  .event-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 4px;
  }
  .scanner-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 28px;
  }

  /* Status */
  .status-icon { font-size: 52px; line-height: 1; margin-bottom: 14px; }
  .guest-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 10px;
    line-height: 1.15;
  }
  .status-label {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 6px 18px;
    border-radius: 100px;
    display: inline-block;
  }
  .status-label.valid   { background: var(--green-bg); color: var(--green); }
  .status-label.error   { background: var(--red-bg);   color: var(--red); }
  .status-label.warn    { background: var(--amber-bg); color: var(--amber); }

  /* Venue rows */
  .venue-rows {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 22px 0 0;
  }
  .venue-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 14px;
    border-radius: 10px;
    background: rgba(0,0,0,.04);
    border: 1.5px solid transparent;
    transition: border-color .2s, background .2s;
  }
  .venue-row.is-current {
    border-color: var(--blush);
    background: rgba(190,148,131,.08);
  }
  .venue-row-name {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--slate);
  }
  .venue-row-status {
    font-size: 12px;
    font-weight: 500;
  }
  .venue-row-status.checked { color: var(--green); }
  .venue-row-status.pending { color: var(--slate); }

  /* Divider */
  .divider {
    display: flex; align-items: center; gap: 10px;
    margin: 24px 0 20px; color: var(--blush);
  }
  .divider .line { flex: 1; height: 1px; background: var(--blush); opacity: .4; }
  .divider .dot  { width: 5px; height: 5px; border-radius: 50%; background: var(--blush); flex-shrink: 0; }

  .code-label {
    font-size: 10px; font-weight: 500; letter-spacing: .18em;
    text-transform: uppercase; color: var(--slate); margin-bottom: 4px;
  }
  .code-value {
    font-size: 15px; color: var(--slate); letter-spacing: .12em; margin-bottom: 24px;
  }

  .btn-confirm {
    display: block;
    background: var(--ink);
    color: var(--cream);
    border: none;
    border-radius: 100px;
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 15px 32px;
    cursor: pointer;
    width: 100%;
  }
  .btn-confirm:disabled { opacity: .5; cursor: default; }

  .loading { color: var(--slate); font-size: 15px; padding: 20px 0; }
  .ready-idle { color: var(--slate); font-size: 14px; padding: 24px 0; line-height: 1.6; }

  /* PIN overlay */
  .pin-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(23,24,29,.88);
    align-items: center; justify-content: center;
    padding: 24px;
    z-index: 10;
  }
  .pin-overlay.is-open { display: flex; }
  .pin-card {
    background: var(--cream);
    border-radius: 20px;
    padding: 40px 32px;
    width: 100%; max-width: 360px;
    text-align: center;
  }
  .pin-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px; font-weight: 600;
    color: var(--ink); margin-bottom: 6px;
  }
  .pin-sub { font-size: 13px; color: var(--slate); margin-bottom: 24px; }
  .pin-input {
    width: 100%;
    border: 1.5px solid #D4C8BE;
    border-radius: 10px;
    padding: 14px 16px;
    font-family: 'Jost', sans-serif;
    font-size: 22px;
    letter-spacing: .3em;
    text-align: center;
    color: var(--ink);
    background: #fff;
    outline: none;
    margin-bottom: 8px;
  }
  .pin-input:focus { border-color: var(--blush); }
  .pin-error { font-size: 12px; color: var(--red); min-height: 18px; margin-bottom: 12px; }
  .btn-pin-submit {
    display: block; width: 100%;
    background: var(--ink); color: var(--cream);
    border: none; border-radius: 100px;
    font-family: 'Jost', sans-serif;
    font-size: 13px; font-weight: 500;
    letter-spacing: .1em; text-transform: uppercase;
    padding: 14px; cursor: pointer; margin-bottom: 10px;
  }
  .btn-pin-submit:disabled { opacity: .5; cursor: default; }
  .btn-pin-cancel {
    background: none; border: none;
    font-family: 'Jost', sans-serif;
    font-size: 13px; color: var(--slate);
    cursor: pointer; padding: 6px;
  }
</style>
</head>
<body>

<!-- Venue selector — set once per device, persists in localStorage -->
<div class="venue-bar">
  <div class="venue-bar-label">Scanner venue</div>
  <div class="venue-toggle">
    <button class="vtoggle" id="vCeremony" data-venue="ceremony">Ceremony</button>
    <button class="vtoggle" id="vReception" data-venue="reception">Reception</button>
  </div>
</div>

<div class="card">
  <div class="event-label">Viola &amp; Kelvin &middot; Dec 18, 2026</div>
  <div class="scanner-title" id="scannerTitle">Guest Verification</div>

  <div class="loading" id="loading" style="display:none">Looking up ticket&hellip;</div>

  <div class="ready-idle" id="idleMsg">
    Scan a guest QR code<br>to verify their invitation.
  </div>

  <div id="result" style="display:none">
    <div class="status-icon" id="icon"></div>
    <div class="guest-name" id="guestName"></div>
    <span class="status-label" id="statusLabel"></span>

    <div class="venue-rows" id="venueRows" style="display:none">
      <div class="venue-row" id="rowCeremony">
        <span class="venue-row-name">Ceremony</span>
        <span class="venue-row-status" id="statusCeremony">—</span>
      </div>
      <div class="venue-row" id="rowReception">
        <span class="venue-row-name">Reception</span>
        <span class="venue-row-status" id="statusReception">—</span>
      </div>
    </div>

    <div class="divider"><span class="line"></span><span class="dot"></span><span class="line"></span></div>
    <div class="code-label">Invitation Code</div>
    <div class="code-value" id="codeDisplay"></div>
    <button class="btn-confirm" id="confirmBtn" style="display:none">Confirm Check-In</button>
  </div>
</div>

<!-- PIN overlay -->
<div class="pin-overlay" id="pinOverlay">
  <div class="pin-card">
    <div class="pin-title">Staff PIN</div>
    <div class="pin-sub" id="pinSub">Enter your staff code to confirm check-in</div>
    <input type="password" inputmode="numeric" maxlength="10" class="pin-input" id="pinInput" placeholder="••••">
    <div class="pin-error" id="pinError"></div>
    <button class="btn-pin-submit" id="pinSubmit">Confirm</button>
    <button class="btn-pin-cancel" id="pinCancel">Cancel</button>
  </div>
</div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const code   = (params.get('code') || '').trim().toUpperCase();
  const $      = id => document.getElementById(id);

  // ── Venue state ──────────────────────────────────────────────────────────
  let currentVenue = 'ceremony';
  try { currentVenue = localStorage.getItem('vk_venue') || 'ceremony'; } catch (_) {}
  if (currentVenue !== 'ceremony' && currentVenue !== 'reception') currentVenue = 'ceremony';

  let guestData = null; // cached API response

  function setVenue(v) {
    currentVenue = v;
    try { localStorage.setItem('vk_venue', v); } catch (_) {}
    $('vCeremony').classList.toggle('is-active', v === 'ceremony');
    $('vReception').classList.toggle('is-active', v === 'reception');
    $('scannerTitle').textContent = v === 'ceremony' ? 'Ceremony Scanner' : 'Reception Scanner';
    if (guestData) renderGuest(guestData, code);
  }

  $('vCeremony').addEventListener('click', () => setVenue('ceremony'));
  $('vReception').addEventListener('click', () => setVenue('reception'));

  // Init toggle UI
  setVenue(currentVenue);

  // ── Guest rendering ──────────────────────────────────────────────────────
  function fmtTime(iso) {
    if (!iso) return '';
    try {
      return new Date(iso).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    } catch (_) { return ''; }
  }

  function updateVenueRow(rowId, statusId, venueObj, venueKey) {
    const isCurrent = venueKey === currentVenue;
    $(rowId).classList.toggle('is-current', isCurrent);
    const st = $(statusId);
    if (venueObj && venueObj.checkedIn) {
      const t = fmtTime(venueObj.checkedInAt);
      st.textContent = t ? '✓ Checked in · ' + t : '✓ Checked in';
      st.className = 'venue-row-status checked';
    } else {
      st.textContent = '— Not yet';
      st.className = 'venue-row-status pending';
    }
  }

  function renderGuest(data, codeVal) {
    guestData = data;
    $('loading').style.display = 'none';
    $('idleMsg').style.display = 'none';
    $('result').style.display = 'block';
    $('codeDisplay').textContent = codeVal || code;
    $('confirmBtn').style.display = 'none';

    if (data.status === 'not_found') {
      $('icon').textContent = '❌';
      $('guestName').textContent = '';
      $('statusLabel').textContent = 'Code Not Recognized';
      $('statusLabel').className = 'status-label error';
      $('venueRows').style.display = 'none';
      return;
    }
    if (data.status === 'not_attending') {
      $('icon').textContent = '⚠️';
      $('guestName').textContent = data.name || '';
      $('statusLabel').textContent = 'Not Marked as Attending';
      $('statusLabel').className = 'status-label warn';
      $('venueRows').style.display = 'none';
      return;
    }

    // Valid guest — show per-venue status
    $('guestName').textContent = data.name || '';
    $('venueRows').style.display = 'flex';
    updateVenueRow('rowCeremony', 'statusCeremony', data.ceremony, 'ceremony');
    updateVenueRow('rowReception', 'statusReception', data.reception, 'reception');

    const venueData = currentVenue === 'ceremony' ? data.ceremony : data.reception;
    const venueName = currentVenue === 'ceremony' ? 'Ceremony' : 'Reception';

    if (venueData && venueData.checkedIn) {
      $('icon').textContent = '⚠️';
      $('statusLabel').textContent = 'Already Admitted — ' + venueName;
      $('statusLabel').className = 'status-label warn';
    } else {
      $('icon').textContent = '✅';
      $('statusLabel').textContent = 'Approved — ' + venueName + ' Entry';
      $('statusLabel').className = 'status-label valid';
      $('confirmBtn').style.display = 'block';
      $('confirmBtn').textContent = 'Confirm ' + venueName + ' Check‑In';
    }
  }

  // ── Fetch guest ──────────────────────────────────────────────────────────
  if (!code) {
    // No code — just show idle scanner
  } else {
    $('idleMsg').style.display = 'none';
    $('loading').style.display = 'block';
    fetch('/api/verify/' + encodeURIComponent(code))
      .then(r => r.json())
      .then(data => renderGuest(data, code))
      .catch(() => renderGuest({ status: 'not_found' }, code));
  }

  // ── Check-in flow ────────────────────────────────────────────────────────
  $('confirmBtn').addEventListener('click', () => {
    const venueName = currentVenue === 'ceremony' ? 'Ceremony' : 'Reception';
    $('pinSub').textContent = 'Enter staff PIN to confirm ' + venueName + ' check-in';
    $('pinInput').value = '';
    $('pinError').textContent = '';
    $('pinOverlay').classList.add('is-open');
    setTimeout(() => $('pinInput').focus(), 50);
  });

  $('pinCancel').addEventListener('click', () => $('pinOverlay').classList.remove('is-open'));

  async function submitPin() {
    const pin = $('pinInput').value.trim();
    if (!pin) { $('pinError').textContent = 'Please enter your staff PIN.'; return; }
    $('pinSubmit').disabled = true;
    $('pinError').textContent = '';
    try {
      const res = await fetch('/api/verify/checkin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, pin, venue: currentVenue }),
      });
      const data = await res.json();
      $('pinOverlay').classList.remove('is-open');

      if (data.status === 'success') {
        // Update local cache so venue rows reflect the new check-in
        if (currentVenue === 'ceremony') {
          guestData.ceremony = { checkedIn: true, checkedInAt: data.checkedInAt };
        } else {
          guestData.reception = { checkedIn: true, checkedInAt: data.checkedInAt };
        }
        const venueName = currentVenue === 'ceremony' ? 'Ceremony' : 'Reception';
        $('icon').textContent = '✅';
        $('statusLabel').textContent = venueName + ' Checked In ✓';
        $('statusLabel').className = 'status-label valid';
        $('confirmBtn').style.display = 'none';
        updateVenueRow('rowCeremony', 'statusCeremony', guestData.ceremony, 'ceremony');
        updateVenueRow('rowReception', 'statusReception', guestData.reception, 'reception');
      } else if (data.status === 'wrong_pin') {
        $('pinOverlay').classList.add('is-open');
        $('pinError').textContent = 'Incorrect PIN — try again.';
      } else if (data.status === 'already_checked_in') {
        renderGuest(guestData, code); // re-render to show warn state
      } else {
        renderGuest({ status: 'not_found' }, code);
      }
    } catch (_) {
      $('pinOverlay').classList.remove('is-open');
      renderGuest({ status: 'not_found' }, code);
    } finally {
      $('pinSubmit').disabled = false;
    }
  }

  $('pinSubmit').addEventListener('click', submitPin);
  $('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitPin(); });
})();
</script>
</body>
</html>
